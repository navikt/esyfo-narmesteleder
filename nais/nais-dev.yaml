apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: esyfo-narmesteleder
  namespace: team-esyfo
  annotations:
    texas.nais.io/enabled: "true"
spec:
  ingresses:
    - https://narmesteleder-api.intern.dev.nav.no
    - https://narmesteleder-api.ekstern.dev.nav.no/api/v1/linemanager
    - https://narmesteleder-api.ekstern.dev.nav.no/swagger
    - https://narmesteleder-api.ekstern.dev.nav.no/openapi

    # Keep these for backwards compatibility
    - https://esyfo-narmesteleder.intern.dev.nav.no
    - https://esyfo-narmesteleder.ekstern.dev.nav.no/api/v1/linemanager
    - https://esyfo-narmesteleder.ekstern.dev.nav.no/swagger
    - https://esyfo-narmesteleder.ekstern.dev.nav.no/openapi
  image: {{image}} #
  port: 8080
  liveness:
    path: /internal/is_alive
    initialDelay: 10
    timeout: 5
    periodSeconds: 10
    failureThreshold: 5
  readiness:
    path: /internal/is_ready
    initialDelay: 10
    periodSeconds: 5
    timeout: 5
  startup:
    path: /internal/is_alive
    initialDelay: 10
    periodSeconds: 10
    timeout: 5
    failureThreshold: 720
  replicas:
    max: 4
    min: 2
    cpuThresholdPercentage: 90
  prometheus:
    enabled: true
    path: /internal/metrics
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  observability:
    logging:
      destinations:
        - id: loki
    autoInstrumentation:
      enabled: true
      runtime: java
  gcp:
    sqlInstances:
      - type: POSTGRES_18
        tier: db-f1-micro
        name: esyfo-narmesteleder-instance
        collation: nb_NO.UTF8
        databases:
          - name: esyfo-narmesteleder-db
            envVarPrefix: NARMESTELEDER_DB
        diskAutoresize: true
  tokenx:
    enabled: true
  maskinporten:
    enabled: true
    scopes:
      exposes:
        - accessibleForAll: true
          delegationSource: altinn
          enabled: true
          product: syfo
          separator: "/"
          name: narmesteleder/lps
          atMaxAge: 680
      consumes:
        - name: "digdir:dialogporten.serviceprovider"
        - name: "altinn:authorization/authorize"
  azure:
    application:
      enabled: true
  leaderElection: true
  accessPolicy:
    inbound:
      rules:
        - application: tokenx-token-generator
          namespace: nais
        - application: narmesteleder-frontend
        - application: dinesykmeldte-backend
        - application: min-side-arbeidsgiver
          namespace: fager
        - application: syfo-budstikka
          namespace: team-esyfo
          permissions:
            roles:
              - linemanager-lookup
        - application: syfo-oppfolgingsplan-backend
          permissions:
            roles:
              - linemanager-lookup
        - application: ditt-sykefravaer
          namespace: flex
        - application: esyfovarsel
          permissions:
            roles:
              - linemanager-lookup
    outbound:
      rules:
        - application: dinesykmeldte-backend
        - application: arbeidsgiver-altinn-tilganger
          namespace: fager
        - application: logging
          namespace: nais-system
      external:
        - host: aareg-services-q2.dev-fss-pub.nais.io
        - host: ereg-services-q2.dev-fss-pub.nais.io
        - host: pdl-api.dev-fss-pub.nais.io
        - host: platform.tt02.altinn.no
  kafka:
    pool: nav-dev
  valkey:
    - instance: felles-cache
      access: readwrite
  envFrom:
    - secret: altinn-subscription-key
