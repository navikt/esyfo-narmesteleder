# prod-gcp. Layered over application.conf when NAIS_CLUSTER_NAME is prod-gcp.
# Secrets and values NAIS injects stay as `${?ENV}` in application.conf.

narmestelederbehov.dialogporten {
  publicIngressUrl = "https://narmesteleder-api.nav.no"
  frontendBaseUrl = "https://www.nav.no/arbeidsgiver"
  updatePollingInterval = "10m"
}

maintenanceTask.interval = "1h"

aareg {
  baseUrl = "https://aareg-services.prod-fss-pub.nais.io"
  scope = "prod-fss.arbeidsforhold.aareg-services-nais"
}

altinn {
  # Also the Dialogporten base URL.
  baseUrl = "https://platform.altinn.no"
  tilganger.baseUrl = "http://arbeidsgiver-altinn-tilganger.fager"
}

dinesykmeldte {
  baseUrl = "http://dinesykmeldte-backend"
  scope = "prod-gcp.team-esyfo.dinesykmeldte-backend"
}

ereg.baseUrl = "https://ereg-services.prod-fss-pub.nais.io"

pdl {
  baseUrl = "https://pdl-api.prod-fss-pub.nais.io/graphql"
  scope = "prod-fss.pdl.pdl-api"
}
