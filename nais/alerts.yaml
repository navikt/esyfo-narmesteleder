apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: esyfo-narmesteleder-dialog-dispatch
  namespace: team-esyfo
  labels:
    team: team-esyfo
spec:
  groups:
    - name: esyfo-narmesteleder-dialog-dispatch
      rules:
        - alert: DialogDispatchParked
          expr: max(syfo_narmesteleder_dialog_dispatch_parked{namespace="team-esyfo", app="esyfo-narmesteleder"}) > 0
          for: 5m
          labels:
            namespace: team-esyfo
            severity: warning
          annotations:
            summary: Dialogporten-oppdateringer krever manuell oppfølging
            consequence: Behov kan ha en dialog som ikke samsvarer med gjeldende tilstand.
            action: Undersøk valideringsfeilen og korriger årsaken før kontrollert replay.
            runbook_url: https://github.com/navikt/esyfo-narmesteleder/blob/main/docs/operations/dialog-dispatch.md
        - alert: DialogDispatchOverdue
          expr: |
            time() - min(syfo_narmesteleder_dialog_dispatch_oldest_pending_timestamp_seconds{namespace="team-esyfo", app="esyfo-narmesteleder"} > 0) > 300
          for: 5m
          labels:
            namespace: team-esyfo
            severity: warning
          annotations:
            summary: Dialogporten-oppdateringer har blitt forsinket
            consequence: Arbeidsgiver kan se utdaterte eller manglende dialoger.
            action: Kontroller kø, worker, databasetilgang og Dialogporten før replay.
            runbook_url: https://github.com/navikt/esyfo-narmesteleder/blob/main/docs/operations/dialog-dispatch.md
        - alert: DialogDispatchWorkerStalled
          expr: |
            (time() - max(syfo_narmesteleder_dialog_dispatch_observed_timestamp_seconds{namespace="team-esyfo", app="esyfo-narmesteleder"}) > 90)
            and
            (max(syfo_narmesteleder_dialog_dispatch_enabled{namespace="team-esyfo", app="esyfo-narmesteleder"}) > 0)
          for: 5m
          labels:
            namespace: team-esyfo
            severity: warning
          annotations:
            summary: Dialogporten-worker oppdaterer ikke status
            consequence: Dialogarbeid kan ha stoppet selv om API-et svarer.
            action: Kontroller worker-logg og databasetilgang. Ikke start gammel prosessering parallelt.
            runbook_url: https://github.com/navikt/esyfo-narmesteleder/blob/main/docs/operations/dialog-dispatch.md
        - alert: DialogDispatchTelemetryMissing
          expr: absent_over_time(syfo_narmesteleder_dialog_dispatch_enabled{namespace="team-esyfo", app="esyfo-narmesteleder"}[5m])
          for: 1m
          labels:
            namespace: team-esyfo
            severity: warning
          annotations:
            summary: Telemetri for Dialogporten-worker mangler
            consequence: Vi kan ikke bekrefte at dialogarbeidet blir behandlet.
            action: Kontroller podder, Prometheus-skraping og worker-konfigurasjon.
            runbook_url: https://github.com/navikt/esyfo-narmesteleder/blob/main/docs/operations/dialog-dispatch.md
