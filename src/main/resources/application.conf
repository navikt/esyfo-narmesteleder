# Each value has a default followed by an optional environment override (`key = ${?ENV}`).
# A setting without a default is required. Values are strings: flags are enabled only by a
# case-insensitive "true", and durations use Kotlin's format, e.g. "30s", "5m" or "24h".

narmestelederbehov {
  creation {
    persistLeesahNlBehov = "true"
    persistLeesahNlBehov = ${?PERSIST_LEESAH_NL_BEHOV}
  }

  expiry {
    daysAfterTom = "16"
    daysAfterTom = ${?DAYS_AFTER_TOM_TO_EXPIRE_BEHOVS}
  }

  dialogporten {
    tasksEnabled = ${?DIALOGPORTEN_TASK_ENABLED}
    publicIngressUrl = ${?PUBLIC_INGRESS_URL}
    frontendBaseUrl = ${?FRONTEND_BASE_URL}
  }

  dialogDispatch {
    enabled = "false"
    enabled = ${?DIALOG_DISPATCH_ENABLED}
    interval = "5s"
  }
}

narmestelederrelasjon {
  persistRegister = "false"
  persistRegister = ${?PERSIST_NARMESTELEDER_REGISTER}
  pdlLeesahConsumerEnabled = "false"
  pdlLeesahConsumerEnabled = ${?PDL_LEESAH_CONSUMER_ENABLED}

  employmentCheck {
    enabled = "false"
    enabled = ${?EMPLOYMENT_CHECK_ENABLED}
    observeSourceEnabled = "false"
    observeSourceEnabled = ${?EMPLOYMENT_CHECK_OBSERVE_SOURCE_ENABLED}
    revokeEnabled = "false"
    revokeEnabled = ${?EMPLOYMENT_CHECK_REVOKE_ENABLED}
  }

  personEnrichmentTask {
    enabled = "false"
    enabled = ${?PERSON_ENRICHMENT_TASK_ENABLED}
    interval = "5m"
    interval = ${?PERSON_ENRICHMENT_TASK_DELAY}
  }
}

sykmelding {
  persistSendtSykmelding = "false"
  persistSendtSykmelding = ${?PERSIST_SENDT_SYKMELDING}
}

# Expires narmesteleder behov and deletes old sykmeldinger.
maintenanceTask {
  enabled = "false"
  enabled = ${?BEHOV_MAINTENANCE_TASK_ENABLED}
  interval = "24h"
  interval = ${?MAINTENANCE_TASK_DELAY}
}

# Injected by NAIS when the manifest sets `leaderElection: true`.
leaderElection {
  path = ${?ELECTOR_PATH}
  sseUrl = ${?ELECTOR_SSE_URL}
}

# External systems. Secrets come from NAIS-injected environment variables and have no default.
aareg {
  baseUrl = ${?AAREG_BASE_URL}
  scope = ${?AAREG_SCOPE}
}

altinn {
  # Also the Dialogporten base URL.
  baseUrl = ${?ALTINN_3_BASE_URL}
  authorization.subscriptionKey = ${?PDP_SUBSCRIPTION_KEY}
  tilganger.baseUrl = ${?ALTINN_TILGANGER_BASE_URL}
}

dinesykmeldte {
  baseUrl = ${?DINESYMELDTE_BASEURL}
  scope = ${?DINESYMELDTE_SCOPE}
}

ereg {
  baseUrl = ${?EREG_BASE_URL}
}

pdl {
  baseUrl = ${?PDL_BASE_URL}
  scope = ${?PDL_SCOPE}
}

# Injected by NAIS when the manifest enables Texas; the pre-authorized apps by `azure.application`.
texas {
  tokenIntrospectionEndpoint = ${?NAIS_TOKEN_INTROSPECTION_ENDPOINT}
  tokenEndpoint = ${?NAIS_TOKEN_ENDPOINT}
  tokenExchangeEndpoint = ${?NAIS_TOKEN_EXCHANGE_ENDPOINT}
  # JSON list of {name, clientId}.
  azurePreAuthorizedApps = ${?AZURE_APP_PRE_AUTHORIZED_APPS}
  # Cluster of the arbeidsgiver-altinn-tilganger TokenX target. NAIS injects NAIS_CLUSTER_NAME on every pod.
  altinnTilgangerCluster = ${?NAIS_CLUSTER_NAME}
}

# Injected by NAIS for `gcp.sqlInstances` with `envVarPrefix: NARMESTELEDER_DB`.
database {
  host = ${?NARMESTELEDER_DB_HOST}
  port = ${?NARMESTELEDER_DB_PORT}
  name = ${?NARMESTELEDER_DB_DATABASE}
  username = ${?NARMESTELEDER_DB_USERNAME}
  password = ${?NARMESTELEDER_DB_PASSWORD}
  # When enabled, every SSL value is required, so a missing certificate stops startup.
  ssl {
    enabled = "true"
    cert = ${?NARMESTELEDER_DB_SSLCERT}
    key = ${?NARMESTELEDER_DB_SSLKEY_PK8}
    rootCert = ${?NARMESTELEDER_DB_SSLROOTCERT}
    mode = ${?NARMESTELEDER_DB_SSLMODE}
  }
}

# Injected by NAIS for the Valkey instance `felles-cache`.
valkey {
  host = ${?VALKEY_HOST_FELLES_CACHE}
  port = ${?VALKEY_PORT_FELLES_CACHE}
  username = ${?VALKEY_USERNAME_FELLES_CACHE}
  password = ${?VALKEY_PASSWORD_FELLES_CACHE}
  ssl = "true"
}

# Injected by NAIS for `kafka.pool`.
kafka {
  brokers = ${?KAFKA_BROKERS}
  consumeTopics = ${?CONSUME_KAFKA_TOPICS}
  # Commits failed batches. Only for local runs; NAIS has no override.
  commitOnAllErrors = "false"
  schemaRegistry {
    url = ${?KAFKA_SCHEMA_REGISTRY}
    # When enabled, the username and password are required.
    authEnabled = "true"
    username = ${?KAFKA_SCHEMA_REGISTRY_USER}
    password = ${?KAFKA_SCHEMA_REGISTRY_PASSWORD}
  }
  # When enabled, every SSL value is required, so a missing keystore stops startup.
  ssl {
    enabled = "true"
    truststorePath = ${?KAFKA_TRUSTSTORE_PATH}
    keystorePath = ${?KAFKA_KEYSTORE_PATH}
    credstorePassword = ${?KAFKA_CREDSTORE_PASSWORD}
  }
}
