info:
  name: get behov collection
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrlEkstern}}/api/v1/linemanager/requirement?orgNumber={{systemKundeOrgnr}}&createdAfter=2025-09-08T11:55:24Z&pageSize=5"
  params:
    - name: orgNumber
      value: "{{systemKundeOrgnr}}"
      type: query
    - name: createdAfter
      value: 2025-09-08T11:55:24Z
      type: query
    - name: pageSize
      value: "5"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const http = require("axios");

        if (bru.getEnvName() === "nl_vars_local") {
          if (!bru.hasEnvVar("token")) {
            throw new Error("Kjør request 'mock maskinporten token' først for å teste lokalt");
          }
        } else {
          const systembrukerOrgnr = bru.getEnvVar("systemKundeOrgnr");
          const tokenrespons = await http.get("https://esyfo-token.intern.dev.nav.no/systembruker/" + systembrukerOrgnr + "?scope=nav%3Asyfo%2Fnarmesteleder%2Flps");
          console.log(tokenrespons.data);
          req.setHeader("Authorization", "Bearer "+ tokenrespons.data);
        }
    - type: after-response
      code: |-
        const body = res.getBody();

        if (body != null) {
          bru.setVar("currentId",body.id);
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  For local setup and creating a behov, see [README.md](README.md).
