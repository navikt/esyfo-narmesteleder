# Application settings. Database, Kafka, Texas and Valkey are still read directly from
# environment variables.
#
# Each value has a default followed by an optional environment override (`key = ${?ENV}`).
# A setting without a default is required. Values are strings: flags are enabled only by a
# case-insensitive "true", and durations use Kotlin's format, e.g. "30s", "5m" or "24h".

narmestelederbehov {
  persistLeesahNlBehov = "true"
  persistLeesahNlBehov = ${?PERSIST_LEESAH_NL_BEHOV}
  publicIngressUrl = ${?PUBLIC_INGRESS_URL}
  frontendBaseUrl = ${?FRONTEND_BASE_URL}
  dialogUpdatePollingInterval = "5m"
  dialogUpdatePollingInterval = ${?DIALOGPORTEN_UPDATE_POLLING_DELAY}

  expiry {
    daysAfterTom = "16"
    daysAfterTom = ${?DAYS_AFTER_TOM_TO_EXPIRE_BEHOVS}
  }

  dialogportenTask {
    enabled = ${?DIALOGPORTEN_TASK_ENABLED}
  }
}

narmestelederrelasjon {
  persistRegister = "false"
  persistRegister = ${?PERSIST_NARMESTELEDER_REGISTER}
  pdlLeesahConsumerEnabled = "false"
  pdlLeesahConsumerEnabled = ${?PDL_LEESAH_CONSUMER_ENABLED}

  employmentCheck {
    enabled = "false"
    enabled = ${?EMPLOYMENT_CHECK_ENABLED}
    observeSourceEnabled = "false"
    observeSourceEnabled = ${?EMPLOYMENT_CHECK_OBSERVE_SOURCE_ENABLED}
    revokeEnabled = "false"
    revokeEnabled = ${?EMPLOYMENT_CHECK_REVOKE_ENABLED}
  }

  personEnrichmentTask {
    enabled = "false"
    enabled = ${?PERSON_ENRICHMENT_TASK_ENABLED}
    interval = "5m"
    interval = ${?PERSON_ENRICHMENT_TASK_DELAY}
  }
}

sykmelding {
  persistSendtSykmelding = "false"
  persistSendtSykmelding = ${?PERSIST_SENDT_SYKMELDING}
}

# Expires narmesteleder behov and deletes old sykmeldinger.
maintenanceTask {
  enabled = "false"
  enabled = ${?BEHOV_MAINTENANCE_TASK_ENABLED}
  interval = "24h"
  interval = ${?MAINTENANCE_TASK_DELAY}
}

# Injected by NAIS when the manifest sets `leaderElection: true`.
leaderElection {
  path = ${?ELECTOR_PATH}
  sseUrl = ${?ELECTOR_SSE_URL}
}

# External systems. Secrets come from NAIS-injected environment variables and have no default.
aareg {
  baseUrl = ${?AAREG_BASE_URL}
  scope = ${?AAREG_SCOPE}
}

altinn {
  # Also the Dialogporten base URL.
  baseUrl = ${?ALTINN_3_BASE_URL}
  authorization.subscriptionKey = ${?PDP_SUBSCRIPTION_KEY}
  tilganger.baseUrl = ${?ALTINN_TILGANGER_BASE_URL}
}

dinesykmeldte {
  baseUrl = ${?DINESYMELDTE_BASEURL}
  scope = ${?DINESYMELDTE_SCOPE}
}

ereg {
  baseUrl = ${?EREG_BASE_URL}
}

pdl {
  baseUrl = ${?PDL_BASE_URL}
  scope = ${?PDL_SCOPE}
}
