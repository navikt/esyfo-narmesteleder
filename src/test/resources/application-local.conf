# Local runs and tests. Layered over application.conf; environment variables are not read.

narmestelederbehov {
  persistLeesahNlBehov = "true"
  publicIngressUrl = "http://localhost:8080"
  frontendBaseUrl = "http://localhost:3000"
  dialogUpdatePollingInterval = "30s"
  expiry.daysAfterTom = "0"
  dialogportenTask.enabled = "true"
}

narmestelederrelasjon {
  persistRegister = "true"
  pdlLeesahConsumerEnabled = "true"
  employmentCheck {
    enabled = "false"
    observeSourceEnabled = "false"
    revokeEnabled = "false"
  }
  personEnrichmentTask {
    enabled = "true"
    interval = "1m"
  }
}

sykmelding.persistSendtSykmelding = "true"

maintenanceTask {
  enabled = "true"
  interval = "1m"
}

leaderElection {
  path = "esyfo-narmesteleder"
  sseUrl = "not.applicable"
}
