# Settings are layered: application-<cluster>.conf (selected by NAIS_CLUSTER_NAME) overrides this file.
# - Secrets and values NAIS injects: `key = ${?ENV}` in this file.
# - Values that differ per environment (URLs, scopes, intervals): application-dev-gcp.conf and application-prod-gcp.conf.
# - Local runs and tests: application-local.conf.
# A setting without a value is required. Values are strings: flags are enabled only by a case-insensitive "true",
# and durations use Kotlin's format, e.g. "30s", "5m" or "24h".

narmestelederbehov {
  expiry.daysAfterTom = "16"
  # publicIngressUrl and frontendBaseUrl are set per cluster.
  dialogporten.updatePollingInterval = "5m"
}

narmestelederrelasjon.personEnrichmentTask.interval = "5m"

# Expires narmesteleder behov and deletes old sykmeldinger.
maintenanceTask.interval = "24h"

# Injected by NAIS when the manifest sets `leaderElection: true`.
leaderElection {
  path = ${?ELECTOR_PATH}
  sseUrl = ${?ELECTOR_SSE_URL}
}

# External systems. Base URLs and scopes are set per cluster; the key comes from the `altinn-subscription-key` secret.
altinn.authorization.subscriptionKey = ${?PDP_SUBSCRIPTION_KEY}

# Injected by NAIS when the manifest enables Texas.
texas {
  tokenIntrospectionEndpoint = ${?NAIS_TOKEN_INTROSPECTION_ENDPOINT}
  tokenEndpoint = ${?NAIS_TOKEN_ENDPOINT}
  tokenExchangeEndpoint = ${?NAIS_TOKEN_EXCHANGE_ENDPOINT}
  # Cluster of the arbeidsgiver-altinn-tilganger TokenX target. NAIS injects NAIS_CLUSTER_NAME on every pod.
  altinnTilgangerCluster = ${?NAIS_CLUSTER_NAME}
}

# Injected by NAIS for `gcp.sqlInstances` with `envVarPrefix: NARMESTELEDER_DB`.
database {
  host = ${?NARMESTELEDER_DB_HOST}
  port = ${?NARMESTELEDER_DB_PORT}
  name = ${?NARMESTELEDER_DB_DATABASE}
  username = ${?NARMESTELEDER_DB_USERNAME}
  password = ${?NARMESTELEDER_DB_PASSWORD}
  # When enabled, every SSL value is required, so a missing certificate stops startup.
  ssl {
    enabled = "true"
    cert = ${?NARMESTELEDER_DB_SSLCERT}
    key = ${?NARMESTELEDER_DB_SSLKEY_PK8}
    rootCert = ${?NARMESTELEDER_DB_SSLROOTCERT}
    mode = ${?NARMESTELEDER_DB_SSLMODE}
  }
}

# Injected by NAIS for the Valkey instance `felles-cache`.
valkey {
  host = ${?VALKEY_HOST_FELLES_CACHE}
  port = ${?VALKEY_PORT_FELLES_CACHE}
  username = ${?VALKEY_USERNAME_FELLES_CACHE}
  password = ${?VALKEY_PASSWORD_FELLES_CACHE}
  ssl = "true"
}

# Injected by NAIS for `kafka.pool`.
kafka {
  brokers = ${?KAFKA_BROKERS}
  # Commits failed batches. Only for local runs; NAIS has no override.
  commitOnAllErrors = "false"
  schemaRegistry {
    url = ${?KAFKA_SCHEMA_REGISTRY}
    # When enabled, the username and password are required.
    authEnabled = "true"
    username = ${?KAFKA_SCHEMA_REGISTRY_USER}
    password = ${?KAFKA_SCHEMA_REGISTRY_PASSWORD}
  }
  # When enabled, every SSL value is required, so a missing keystore stops startup.
  ssl {
    enabled = "true"
    truststorePath = ${?KAFKA_TRUSTSTORE_PATH}
    keystorePath = ${?KAFKA_KEYSTORE_PATH}
    credstorePassword = ${?KAFKA_CREDSTORE_PASSWORD}
  }
}
