# Local runs and tests. Layered over application.conf; environment variables are not read.

narmestelederbehov {
  expiry.daysAfterTom = "0"
  dialogporten {
    publicIngressUrl = "http://localhost:8080"
    frontendBaseUrl = "http://localhost:3000"
  }
  dialogDispatch.enabled = "true"
}

narmestelederrelasjon.personEnrichmentTask.interval = "1m"

maintenanceTask.interval = "1m"

leaderElection {
  path = "esyfo-narmesteleder"
  sseUrl = "not.applicable"
}

aareg {
  baseUrl = ""
  scope = "aareg"
}

altinn {
  baseUrl = "http://localhost:8080/dialogporten"
  authorization.subscriptionKey = "secret-key"
  tilganger.baseUrl = "https://altinn-tilganger-api.dev.intern.nav.no"
}

dinesykmeldte {
  baseUrl = ""
  scope = ""
}

ereg.baseUrl = "https://ereg-test.intern.nav.no"

pdl {
  baseUrl = "https://pdl-api.dev.intern.nav.no"
  scope = "pdl"
}

texas {
  tokenIntrospectionEndpoint = "http://localhost:3000/api/v1/introspect"
  tokenEndpoint = "http://localhost:3000/api/v1/token"
  tokenExchangeEndpoint = "http://localhost:3000/api/v1/token/exchange"
  altinnTilgangerCluster = "local"
}

database {
  host = "localhost"
  port = "5432"
  name = "esyfo-narmesteleder_dev"
  username = "username"
  password = "password"
  ssl.enabled = "false"
}

valkey {
  host = "localhost"
  port = "6379"
  username = "default"
  password = "test"
  ssl = "false"
}

kafka {
  brokers = "http://localhost:9092"
  # Set to "true" to acknowledge an invalid message that keeps failing during local testing.
  commitOnAllErrors = "false"
  schemaRegistry {
    url = "http://localhost:8081"
    authEnabled = "false"
  }
  ssl.enabled = "false"
}
