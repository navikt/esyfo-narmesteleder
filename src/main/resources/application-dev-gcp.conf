# dev-gcp. Layered over application.conf when NAIS_CLUSTER_NAME is dev-gcp.
# Secrets and values NAIS injects stay as `${?ENV}` in application.conf.

narmestelederbehov.dialogporten {
  publicIngressUrl = "https://narmesteleder-api.ekstern.dev.nav.no"
  frontendBaseUrl = "https://www.ekstern.dev.nav.no/arbeidsgiver"
  updatePollingInterval = "10m"
}

maintenanceTask.interval = "10m"

aareg {
  baseUrl = "https://aareg-services-q2.dev-fss-pub.nais.io"
  scope = "dev-fss.arbeidsforhold.aareg-services-nais"
}

altinn {
  # Also the Dialogporten base URL.
  baseUrl = "https://platform.tt02.altinn.no"
  tilganger.baseUrl = "http://arbeidsgiver-altinn-tilganger.fager"
}

dinesykmeldte {
  baseUrl = "http://dinesykmeldte-backend"
  scope = "dev-gcp.team-esyfo.dinesykmeldte-backend"
}

ereg.baseUrl = "https://ereg-services-q2.dev-fss-pub.nais.io"

pdl {
  baseUrl = "https://pdl-api.dev-fss-pub.nais.io/graphql"
  scope = "dev-fss.pdl.pdl-api"
}
