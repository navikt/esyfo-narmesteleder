info:
  name: create tokenx
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:6969/tokenx/token
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: authorization_code
      - name: code
        value: tokenx
      - name: client_id
        value: esyfo-narmesteleder
      - name: acr
        value: Level4
      - name: pid
        value: "15823349332"
      - name: aud
        value: esyfo-narmesteleder
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const token = res.getBody();

        if (token != null) {
          bru.setEnvVar("token", token.id_token)
          bru.setEnvVar("identityProvider", "tokenx")
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
